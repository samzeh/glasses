<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Voice Notes</title>
<meta name="description" content="Record a voice note, get a spoken summary back." />
<style>
  :root {
    --bg: #f7f7f8;
    --surface: #ffffff;
    --text: #18181b;
    --muted: #6b7280;
    --border: #e4e4e7;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --rec: #dc2626;
    --ok: #059669;
    --err: #b91c1c;
    --meter: #4f46e5;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa;
      --border: #27272a; --accent: #6366f1; --rec: #ef4444; --ok: #10b981;
      --err: #f87171; --meter: #818cf8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #09090b; --surface: #18181b; --text: #f4f4f5; --muted: #a1a1aa;
    --border: #27272a; --accent: #6366f1; --rec: #ef4444; --ok: #10b981;
    --err: #f87171; --meter: #818cf8;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 0.9rem; margin: 0 0 22px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
  }
  .stage { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  #meter { width: 100%; height: 64px; display: block; border-radius: 8px; background: transparent; }
  .timer { font-variant-numeric: tabular-nums; font-size: 2rem; font-weight: 600; letter-spacing: -0.02em; }
  .timer.idle { color: var(--muted); }
  .hint { color: var(--muted); font-size: 0.85rem; text-align: center; min-height: 1.3em; margin: 0; }
  button {
    font: inherit; font-weight: 600; border: 1px solid var(--border);
    border-radius: 999px; padding: 13px 26px; cursor: pointer;
    background: var(--surface); color: var(--text); transition: transform 0.08s ease, opacity 0.15s ease;
  }
  button:active:not(:disabled) { transform: scale(0.97); }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; min-width: 190px; }
  button.danger { background: var(--rec); color: #fff; border-color: transparent; min-width: 190px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > button { flex: 1 1 auto; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--rec); display: inline-block; margin-right: 7px; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: 0.25 } }
  .recording .dot { animation: pulse 1.3s ease-in-out infinite; }
  h2 { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); margin: 0 0 8px; }
  .summary { font-size: 1.06rem; white-space: pre-wrap; margin: 0; }
  details { margin-top: 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 0.85rem; }
  .transcript { white-space: pre-wrap; color: var(--muted); font-size: 0.9rem; margin: 10px 0 0; }
  .err { color: var(--err); }
  .hidden { display: none !important; }
  .spin { display: inline-block; width: 15px; height: 15px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%; animation: rot 0.8s linear infinite;
    vertical-align: -3px; margin-right: 8px; }
  @keyframes rot { to { transform: rotate(360deg) } }
  .banner { font-size: 0.85rem; padding: 11px 13px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface); color: var(--err); margin-bottom: 14px; }
</style>
</head>
<body>
<main>
  <h1>Voice Notes</h1>
  <p class="sub">Record a note. Get a spoken summary back.</p>

  <div id="banner" class="banner hidden"></div>

  <div class="card stage" id="stage">
    <canvas id="meter" width="520" height="64" aria-hidden="true"></canvas>
    <div class="timer idle" id="timer">0:00</div>
    <div class="row" style="width:100%">
      <button class="primary" id="record">Start recording</button>
      <button id="auto">Auto</button>
    </div>
    <p class="hint" id="hint">Tap to start. Recording stops automatically after five minutes.</p>
    <p class="hint" id="autoStatus"></p>
  </div>

  <div class="card hidden" id="result">
    <h2>Summary</h2>
    <p class="summary" id="summary"></p>
    <div class="row" style="margin-top:16px">
      <button id="play">Play summary</button>
      <button id="again">Record another</button>
    </div>
    <details id="transcriptWrap" class="hidden">
      <summary>Show transcript</summary>
      <p class="transcript" id="transcript"></p>
    </details>
  </div>
</main>

<script>
(() => {
  'use strict';

  const MAX_SECONDS = 300;
  const MIME_CANDIDATES = [
    'audio/webm;codecs=opus',
    'audio/webm',
    'audio/mp4;codecs=mp4a.40.2',
    'audio/mp4',
    'audio/ogg;codecs=opus',
  ];

  const el = (id) => document.getElementById(id);
  const ui = {
    stage: el('stage'), meter: el('meter'), timer: el('timer'), record: el('record'),
    hint: el('hint'), result: el('result'), summary: el('summary'), play: el('play'),
    again: el('again'), transcriptWrap: el('transcriptWrap'), transcript: el('transcript'),
    banner: el('banner'), auto: el('auto'), autoStatus: el('autoStatus'),
  };

  // --- automatic mode ----------------------------------------------------
  // The microphone is here and the camera is on the hub, so neither side can
  // decide alone. This half does voice activity detection, because it is the
  // half holding the stream, and reports it. The hub owns the policy — dwell
  // plus speech, and when a conversation has ended — because that policy is
  // already written and tested there, and two copies of it would drift.
  //
  // Recording starts on *local* voice activity rather than waiting for the
  // hub to confirm: a round trip would cost the first words. What the hub
  // decides is whether the recording is kept. Most are not.

  //: Loudness above which a frame counts as speech. Hand-tuned; the level
  //: meter beside it is the thing to calibrate against in a noisy room.
  const VAD_THRESHOLD = 0.035;
  //: Sustained speech before it counts, so a cough is not a conversation.
  const VAD_ATTACK_MS = 250;
  //: Silence before speech is declared over. Generous: people pause inside
  //: sentences, and a short hangover shreds one utterance into many.
  const VAD_RELEASE_MS = 1200;
  const VAD_INTERVAL_MS = 50;
  const POLL_MS = 1000;
  //: Give up on an un-opened encounter rather than record indefinitely.
  const ORPHAN_LIMIT_MS = 45000;

  let autoOn = false;
  let vadTimer = 0, pollTimer = 0;
  let speechOn = false, aboveSince = 0, belowSince = 0;
  let waveform = null;
  let liveEncounterId = null;   // the hub's id for the conversation in progress
  let recordingSince = 0;
  let autoSubmitId = null;      // encounter this recording should be filed under
  let discardNext = false;      // this recording ended in an expired encounter

  let state = 'idle';
  let stream = null, recorder = null, chunks = [], chosenMime = '';
  let audioCtx = null, analyser = null, rafId = 0, levels = null;
  let tickId = 0, startedAt = 0;
  let summaryText = '';
  let player = null;        // reused <audio>, created on a user gesture for iOS
  let spokenUnlocked = false;

  function setBanner(message) {
    ui.banner.textContent = message || '';
    ui.banner.classList.toggle('hidden', !message);
  }

  function fmt(totalSeconds) {
    const m = Math.floor(totalSeconds / 60);
    const s = Math.floor(totalSeconds % 60);
    return m + ':' + String(s).padStart(2, '0');
  }

  function pickMime() {
    if (typeof MediaRecorder === 'undefined') return null;
    for (const candidate of MIME_CANDIDATES) {
      if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(candidate)) return candidate;
    }
    return '';  // let the browser choose its own default
  }

  function setState(next, hint) {
    state = next;
    ui.stage.classList.toggle('recording', next === 'recording');
    ui.timer.classList.toggle('idle', next !== 'recording');
    const busy = next === 'requesting' || next === 'processing';
    // Automatic mode owns the recorder; the manual button must stay out of it
    // (and setState runs after armAuto, so disabling it there would be undone).
    ui.record.disabled = busy || autoOn;
    if (next === 'recording') {
      ui.record.className = 'danger';
      ui.record.innerHTML = '<span class="dot"></span>Stop and summarize';
    } else if (busy) {
      ui.record.className = 'primary';
      ui.record.innerHTML = '<span class="spin"></span>' + (next === 'requesting' ? 'Waiting for mic' : 'Summarizing');
    } else {
      ui.record.className = 'primary';
      ui.record.textContent = 'Start recording';
    }
    if (hint !== undefined) {
      ui.hint.textContent = hint;
      ui.hint.classList.toggle('err', next === 'error');
    }
  }

  // iOS blocks speech and audio that does not originate in a user gesture.
  // The summary arrives seconds after the tap, so claim both channels now.
  function unlockAudioOutput() {
    if (!player) {
      player = new Audio();
      player.preload = 'auto';
    }
    if (!spokenUnlocked && 'speechSynthesis' in window) {
      try {
        const warm = new SpeechSynthesisUtterance(' ');
        warm.volume = 0;
        speechSynthesis.speak(warm);
        spokenUnlocked = true;
      } catch { /* not fatal */ }
    }
  }

  function drawMeter() {
    const canvas = ui.meter;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    const cssWidth = canvas.clientWidth || 520;
    if (canvas.width !== Math.round(cssWidth * dpr)) {
      canvas.width = Math.round(cssWidth * dpr);
      canvas.height = Math.round(64 * dpr);
    }
    const w = canvas.width, h = canvas.height;
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--meter').trim() || '#4f46e5';

    const render = () => {
      rafId = requestAnimationFrame(render);
      ctx.clearRect(0, 0, w, h);
      if (!analyser) return;
      analyser.getByteFrequencyData(levels);
      const bars = 48;
      const gap = 2 * dpr;
      const barWidth = (w - gap * (bars - 1)) / bars;
      ctx.fillStyle = accent;
      for (let i = 0; i < bars; i++) {
        const idx = Math.floor((i / bars) * levels.length * 0.7);
        const magnitude = levels[idx] / 255;
        const barHeight = Math.max(2 * dpr, magnitude * h * 0.92);
        const x = i * (barWidth + gap);
        const y = (h - barHeight) / 2;
        const r = Math.min(barWidth / 2, 2 * dpr);
        ctx.beginPath();
        ctx.roundRect ? ctx.roundRect(x, y, barWidth, barHeight, r) : ctx.rect(x, y, barWidth, barHeight);
        ctx.fill();
      }
    };
    render();
  }

  function teardownMeter() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = 0;
    analyser = null;
    if (audioCtx) { audioCtx.close().catch(() => {}); audioCtx = null; }
    const ctx = ui.meter.getContext('2d');
    ctx.clearRect(0, 0, ui.meter.width, ui.meter.height);
  }

  function releaseMic() {
    if (stream) stream.getTracks().forEach((t) => t.stop());
    stream = null;
  }

  function stopTimer() {
    if (tickId) clearInterval(tickId);
    tickId = 0;
  }

  // Opening the microphone is separate from recording because automatic mode
  // needs the stream for voice activity long before, and between, recordings.
  // Reuses a live stream: a second getUserMedia on the same device is asking
  // for trouble on iOS.
  async function openMic() {
    if (stream && stream.getAudioTracks().some((t) => t.readyState === 'live')) return true;

    try {
      stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
      });
    } catch (err) {
      const name = err && err.name;
      const message = name === 'NotAllowedError'
        ? 'Microphone access was blocked. Enable it for this site in your browser settings, then reload.'
        : name === 'NotFoundError'
          ? 'No microphone was found on this device.'
          : 'Could not open the microphone: ' + (name || 'unknown error');
      setState('error', message);
      return false;
    }

    // A device unplugged or an interrupting call ends the track mid-recording.
    stream.getAudioTracks().forEach((track) => {
      track.addEventListener('ended', () => {
        if (state === 'recording') stopRecording();
        if (autoOn) disarmAuto('The microphone was disconnected.');
      });
    });

    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') await audioCtx.resume();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;
      analyser.smoothingTimeConstant = 0.75;
      levels = new Uint8Array(analyser.frequencyBinCount);
      // Time domain, separate from the meter's frequency bins: loudness is
      // what voice activity is measured on.
      waveform = new Uint8Array(analyser.fftSize);
      audioCtx.createMediaStreamSource(stream).connect(analyser);
      drawMeter();
    } catch { /* the meter is cosmetic; recording continues without it */ }
    return true;
  }

  async function startRecording() {
    setBanner('');
    ui.result.classList.add('hidden');
    unlockAudioOutput();
    setState('requesting', 'Allow microphone access to continue.');

    chosenMime = pickMime();
    if (chosenMime === null) {
      setState('error', 'This browser cannot record audio. Try Chrome or Safari.');
      return;
    }
    if (!await openMic()) return;

    chunks = [];
    try {
      recorder = chosenMime
        ? new MediaRecorder(stream, { mimeType: chosenMime })
        : new MediaRecorder(stream);
    } catch {
      recorder = new MediaRecorder(stream);
    }
    chosenMime = recorder.mimeType || chosenMime || 'audio/webm';

    recorder.addEventListener('dataavailable', (event) => {
      if (event.data && event.data.size > 0) chunks.push(event.data);
    });
    recorder.addEventListener('stop', onRecorderStop);
    recorder.start(1000);   // one-second chunks survive a crash mid-recording

    startedAt = Date.now();
    ui.timer.textContent = '0:00';
    tickId = setInterval(() => {
      const elapsed = (Date.now() - startedAt) / 1000;
      ui.timer.textContent = fmt(elapsed);
      if (elapsed >= MAX_SECONDS) stopRecording();
    }, 200);

    recordingSince = Date.now();
    setState('recording', autoOn
      ? 'Heard you. Recording while the hub decides if this is a conversation.'
      : 'Listening. Tap stop when you are done.');
  }

  function stopRecording(options) {
    if (!recorder || recorder.state === 'inactive') return;
    discardNext = Boolean(options && options.discard);
    stopTimer();
    setState('processing', discardNext
      ? 'Not a conversation. Discarding.'
      : 'Sending to the model. This usually takes a few seconds.');
    recorder.stop();
  }

  // --- automatic mode: voice activity here, policy on the hub -------------

  function autoHint() {
    if (!autoOn) return '';
    return 'Auto on. Talk to someone in front of the camera — nothing to press.';
  }

  function setAutoStatus(text) {
    ui.autoStatus.textContent = text || '';
  }

  /** Loudness of the current frame, 0..1. */
  function loudness() {
    if (!analyser || !waveform) return 0;
    analyser.getByteTimeDomainData(waveform);
    let sum = 0;
    for (let i = 0; i < waveform.length; i++) {
      const centred = (waveform[i] - 128) / 128;
      sum += centred * centred;
    }
    return Math.sqrt(sum / waveform.length);
  }

  async function reportVad(event) {
    try {
      const res = await fetch('/api/vad', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ event }),
      });
      applyTriggerState(await res.json());
    } catch { /* the poll will catch up */ }
  }

  // Attack and release are asymmetric on purpose: quick to notice speech so
  // the recording starts with the first word, slow to call it over so a pause
  // mid-sentence does not split one utterance into several.
  function pollVad() {
    const now = Date.now();
    const loud = loudness() > VAD_THRESHOLD;

    if (loud) {
      belowSince = 0;
      if (!aboveSince) aboveSince = now;
      if (!speechOn && now - aboveSince >= VAD_ATTACK_MS) {
        speechOn = true;
        // 'requesting' matters: startRecording is async, and without it a
        // tick 50ms later would open a second recorder on the same stream.
        if (state !== 'recording' && state !== 'processing' && state !== 'requesting') {
          startRecording();
        }
        reportVad('start');
      }
    } else {
      aboveSince = 0;
      if (!belowSince) belowSince = now;
      if (speechOn && now - belowSince >= VAD_RELEASE_MS) {
        speechOn = false;
        reportVad('end');
      }
    }
  }

  /** What the hub says, turned into keep, discard, or carry on. */
  function applyTriggerState(trigger) {
    if (!trigger || trigger.available === false) {
      setAutoStatus('Hub not reachable — start auto_hub.py. Recording will not be kept.');
      return;
    }
    if (trigger.encounter_id) liveEncounterId = trigger.encounter_id;
    if (trigger.confirmed && liveEncounterId) autoSubmitId = liveEncounterId;

    const parts = [];
    parts.push(trigger.faces_in_view ? `${trigger.faces_in_view} face in view` : 'no face in view');
    parts.push(trigger.confirmed ? 'conversation confirmed'
      : trigger.active ? 'watching' : 'idle');
    setAutoStatus(parts.join(' · '));

    const finished = trigger.finished_id;
    if (finished && liveEncounterId && finished === liveEncounterId) {
      liveEncounterId = null;
      if (state === 'recording') {
        // "closed" is a real conversation; "expired" never became one, and
        // the hub has already deleted its video.
        stopRecording({ discard: trigger.finished_status !== 'closed' });
      }
      return;
    }

    // Nothing opened on the hub and nobody is talking: this was a noise.
    if (state === 'recording' && !trigger.active && !speechOn
        && Date.now() - recordingSince > ORPHAN_LIMIT_MS) {
      stopRecording({ discard: true });
    }
  }

  async function pollTrigger() {
    try {
      const res = await fetch('/api/trigger', { cache: 'no-store' });
      applyTriggerState(await res.json());
    } catch {
      setAutoStatus('Hub not reachable — start auto_hub.py.');
    }
  }

  async function armAuto() {
    unlockAudioOutput();     // one gesture buys the mic and the playback
    setState('requesting', 'Allow microphone access to continue.');
    chosenMime = pickMime();
    if (chosenMime === null) {
      setState('error', 'This browser cannot record audio. Try Chrome or Safari.');
      return;
    }
    if (!await openMic()) return;
    // Voice activity is measured on the analyser. Without it nothing would
    // ever trigger, and auto mode would sit there looking armed.
    if (!analyser || !waveform) {
      setState('error', 'This browser could not open an audio analyser, so automatic mode cannot hear you. Use Start recording instead.');
      return;
    }

    autoOn = true;
    speechOn = false;
    aboveSince = belowSince = 0;
    ui.auto.className = 'danger';
    ui.auto.textContent = 'Auto on';
    ui.record.disabled = true;
    vadTimer = setInterval(pollVad, VAD_INTERVAL_MS);
    pollTimer = setInterval(pollTrigger, POLL_MS);
    pollTrigger();
    setState('idle', autoHint());
  }

  function disarmAuto(message) {
    autoOn = false;
    if (vadTimer) clearInterval(vadTimer);
    if (pollTimer) clearInterval(pollTimer);
    vadTimer = pollTimer = 0;
    speechOn = false;
    liveEncounterId = autoSubmitId = null;
    ui.auto.className = '';
    ui.auto.textContent = 'Auto';
    ui.record.disabled = false;
    setAutoStatus('');
    if (state === 'recording') stopRecording({ discard: true });
    else {
      teardownMeter();
      releaseMic();
      setState('idle', message || 'Tap to start. Recording stops automatically after five minutes.');
    }
  }

  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onerror = () => reject(new Error('Could not read the recording.'));
      reader.onload = () => {
        const result = String(reader.result);
        const comma = result.indexOf(',');
        resolve(comma === -1 ? result : result.slice(comma + 1));
      };
      reader.readAsDataURL(blob);
    });
  }

  async function onRecorderStop() {
    // In automatic mode the microphone and meter stay up: voice activity has
    // to keep being watched for the next conversation.
    if (!autoOn) {
      teardownMeter();
      releaseMic();
    }

    const seconds = (Date.now() - startedAt) / 1000;
    const blob = new Blob(chunks, { type: chosenMime });
    chunks = [];
    const encounterId = autoSubmitId;
    autoSubmitId = null;

    if (discardNext) {
      discardNext = false;
      setState('idle', autoOn ? autoHint() : 'Discarded.');
      return;
    }

    if (seconds < 1 || blob.size < 2000) {
      setState('idle', 'That recording was too short to summarize. Try again and speak for a few seconds.');
      return;
    }

    let base64;
    try {
      base64 = await blobToBase64(blob);
    } catch (err) {
      setState('error', err.message);
      return;
    }

    try {
      const res = await fetch('/api/summarize', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        // encounterId files this note against the conversation the hub
        // recorded, instead of inventing a second encounter for the audio.
        body: JSON.stringify({
          audio: base64, mimeType: chosenMime,
          durationMs: Math.round(seconds * 1000), encounterId,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || ('Request failed with status ' + res.status));

      summaryText = data.summary || '';
      ui.summary.textContent = summaryText;
      ui.result.classList.remove('hidden');
      if (data.transcript) {
        ui.transcript.textContent = data.transcript;
        ui.transcriptWrap.classList.remove('hidden');
      } else {
        ui.transcriptWrap.classList.add('hidden');
      }
      setState('idle', 'Saved to TigerData. Play the summary or record another.');
      ui.timer.textContent = fmt(seconds);
      speak(summaryText, { auto: true });
    } catch (err) {
      setState('error', err.message || 'Something went wrong talking to the server.');
    }
  }

  // Prefer the model's voice. Fall back to the browser's own if that call
  // fails, so the demo never ends in silence.
  async function speak(text, options) {
    if (!text) return;
    const auto = options && options.auto;
    ui.play.disabled = true;
    ui.play.textContent = 'Loading voice';
    try {
      const res = await fetch('/api/speak', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ text }),
      });
      if (!res.ok) throw new Error('tts unavailable');
      const data = await res.json();
      if (!data.audio) throw new Error('tts empty');
      if (!player) player = new Audio();
      player.src = 'data:audio/wav;base64,' + data.audio;
      ui.play.textContent = 'Play summary';
      ui.play.disabled = false;
      try {
        await player.play();
      } catch {
        // Autoplay refused, which is normal on iOS. The button still works.
        if (auto) setBanner('Tap "Play summary" to hear it. This browser blocks automatic playback.');
      }
    } catch {
      ui.play.textContent = 'Play summary';
      ui.play.disabled = false;
      speakWithBrowser(text, auto);
    }
  }

  function speakWithBrowser(text, auto) {
    if (!('speechSynthesis' in window)) {
      if (auto) setBanner('This browser cannot speak the summary. The text is above.');
      return;
    }
    try {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = 1.0;
      speechSynthesis.speak(utterance);
    } catch {
      if (auto) setBanner('Could not play the summary aloud. The text is above.');
    }
  }

  ui.record.addEventListener('click', () => {
    if (state === 'recording') stopRecording();
    else if (state !== 'requesting' && state !== 'processing') startRecording();
  });

  ui.play.addEventListener('click', () => {
    unlockAudioOutput();
    setBanner('');
    if (player && player.src) {
      player.currentTime = 0;
      player.play().catch(() => speakWithBrowser(summaryText, false));
    } else {
      speak(summaryText, { auto: false });
    }
  });

  ui.again.addEventListener('click', () => {
    if (player) player.pause();
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    setBanner('');
    ui.result.classList.add('hidden');
    ui.timer.textContent = '0:00';
    // In automatic mode the next recording starts itself, on the next voice.
    if (autoOn) setState('idle', autoHint());
    else startRecording();
  });

  ui.auto.addEventListener('click', () => {
    if (autoOn) disarmAuto();
    else armAuto();
  });

  // Backgrounding on iOS suspends the audio context and can interrupt capture.
  // Automatic mode cannot survive it either: no audio context, no voice
  // activity, so say so rather than appear to still be listening.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) return;
    if (state === 'recording') stopRecording();
    if (autoOn) disarmAuto('Auto mode stopped: this browser suspends audio in the background.');
  });

  window.addEventListener('pagehide', releaseMic);

  if (!window.isSecureContext) {
    setBanner('This page is not on HTTPS, so the microphone will not open. See the README for the tunnel step.');
  }

  fetch('/api/health')
    .then((r) => r.json())
    .then((d) => {
      if (!d.databaseReady) setBanner('TigerData is unavailable. Check the server and database connection.');
      else if (!d.keyConfigured) setBanner('The server has no GEMINI_API_KEY set. Add it to .env and restart.');
    })
    .catch(() => {});

  setState('idle');
})();
</script>
</body>
</html>
